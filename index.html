<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">

<title>Credit Risk Analysis Exercise</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2399DF2B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --ink: #101828; --text: #344054; --mut: #667085; --mut2: #98A2B3; --line: #EAECF0; --line2: #D0D5DD; --lime: #99DF2B; --lime-l: #EEF9DC; --green-d: #3B7F1D; --red: #B42318; }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #fff; overflow-x: hidden; }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; color: var(--text); font-family: 'Figtree', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
header, footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 22px 32px; }
header { font-size: 14px; }
header b { color: var(--ink); font-weight: 800; letter-spacing: -.005em; }
header span:last-child { color: var(--mut); font-weight: 500; }
footer { font-size: 12.5px; color: var(--mut2); flex-wrap: wrap; }
main { flex: 1; position: relative; overflow: hidden; isolation: isolate; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 30px; padding: 24px 16px 40px; }
main::before { content: ''; position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(153, 223, 43, .16) 0%, rgba(153, 223, 43, 0) 62%); pointer-events: none; z-index: -1; }
.hello { margin: 0; font-size: clamp(30px, 5.4vw, 52px); line-height: 1.04; font-weight: 900; color: var(--ink); letter-spacing: -.025em; max-width: 14em; }
.sub { margin: 0; max-width: 470px; font-size: 16.5px; line-height: 1.5; color: var(--mut); }
.stage { position: relative; width: 208px; height: 208px; display: grid; place-items: center; }
.ring { position: absolute; inset: 0; border-radius: 50%; background: var(--lime); opacity: 0; animation: pulse 2.8s cubic-bezier(.2, .6, .3, 1) infinite; }
.ring.r2 { animation-delay: 1.4s; }
@keyframes pulse { 0% { transform: scale(.94); opacity: .5; } 100% { transform: scale(1.8); opacity: 0; } }
.enter { position: relative; width: 208px; height: 208px; border-radius: 50%; border: 0; padding: 0 30px; background: var(--lime); color: var(--ink); font: 800 20px/1.15 'Figtree', Helvetica, Arial, sans-serif; letter-spacing: -.01em; cursor: pointer; box-shadow: 0 14px 36px rgba(110, 170, 20, .32); transition: transform .3s cubic-bezier(.3, 1.4, .5, 1), box-shadow .3s ease; -webkit-tap-highlight-color: transparent; }
.enter:hover { transform: scale(1.05); box-shadow: 0 18px 46px rgba(110, 170, 20, .42); }
.enter:active { transform: scale(.98); }
.enter:focus-visible { outline: 3px solid var(--ink); outline-offset: 8px; }
.enter svg { display: block; margin: 12px auto 0; width: 30px; height: 30px; transition: transform .3s ease; }
.enter:hover svg { transform: translateX(4px); }
.enter.busy { cursor: progress; }
.cover { position: fixed; left: 0; top: 0; width: 208px; height: 208px; border-radius: 50%; background: var(--lime); transform: scale(0); pointer-events: none; z-index: 20; }
.cover.go { transition: transform .8s cubic-bezier(.75, 0, .2, 1); }
.veil { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 21; transition: opacity .32s ease; }
.veil.go { opacity: 1; }
.lock { width: 208px; height: 208px; border-radius: 50%; display: grid; place-items: center; background: #F4F4F4; color: var(--mut2); }
.lock svg { width: 46px; height: 46px; }
form.code { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 0; }
form.code input { font: 500 16px 'Figtree', Helvetica, Arial, sans-serif; padding: 13px 18px; border: 1px solid var(--line2); border-radius: 45px; width: min(300px, 82vw); color: var(--ink); background: #fff; }
form.code input:focus { outline: 2px solid var(--lime); outline-offset: 1px; border-color: var(--lime); }
form.code button { font: 700 15px 'Figtree', Helvetica, Arial, sans-serif; padding: 13px 24px; border-radius: 45px; border: 0; background: var(--ink); color: #fff; cursor: pointer; }
.msg { min-height: 20px; margin: -14px 0 0; font-size: 14px; color: var(--red); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { .ring { animation: none; } .cover.go, .veil { transition: none; } }
@media (max-width: 560px) {
  header, footer { padding: 16px; }
  header { font-size: 13px; }
  main { gap: 26px; }
  .stage, .enter, .lock, .cover { width: 176px; height: 176px; }
  .enter { font-size: 18px; padding: 0 24px; }
  .sub { font-size: 15.5px; }
}
</style>
</head>
<body>
<header><span><b>Credit Risk Analysis Exercise</b></span><span>Eugenio Paoli</span></header>
<main>
  <h1 class="hello" id="hello">Welcome</h1>
  <div class="stage" id="stage" hidden>
    <span class="ring"></span><span class="ring r2"></span>
    <button class="enter" id="enter" type="button">Enter the analysis<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="lock" id="lock" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <p class="sub" id="sub">Where the risk sits in the 2024 book, how the monthly vintages compare, and a simulator to test the policy changes.</p>
  <form class="code" id="form" hidden autocomplete="off"><input id="code" type="text" inputmode="text" placeholder="Paste your link or access code" aria-label="Link or access code"><button type="submit">Unlock</button></form>
  <p class="msg" id="msg" role="status"></p>
</main>
<footer><span id="foot">Private link. Please do not forward it.</span><span>November 2026</span></footer>

<script>
(function () {
  'use strict';
  var CFG = JSON.parse(document.getElementById('cfg').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var SKEY = 'crc_k', R = null, P = null, VIEW = 'explore';
  var SUB = document.getElementById('sub').textContent;
  var VIEW_RE = /^(explore|cohorts|simulator)(\/[a-z]+)?$/;

  function log(ev, extra) {
    var who = R || 'no link';
    var line = who + ': ' + ev + (extra ? ' (' + extra + ')' : '');
    try {
      if (CFG.log && CFG.log.ntfy) fetch(CFG.log.ntfy + '?title=' + encodeURIComponent('Credit risk case') + '&tags=eyes', { method: 'POST', body: line, mode: 'no-cors', keepalive: true }).catch(function () {});
      var f = CFG.log && CFG.log.form;
      if (f && f.url) {
        var d = new URLSearchParams(); d.append(f.who, who); d.append(f.ev, ev); d.append(f.extra, extra || ''); d.append(f.ua, (navigator.userAgent || '').slice(0, 200));
        fetch(f.url, { method: 'POST', mode: 'no-cors', body: d, keepalive: true }).catch(function () {});
      }
    } catch (e) {}
  }
  function b64(s) { var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function hex(buf) { return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join(''); }
  function parseHash() {
    var h = location.hash.replace(/^#/, ''), out = {};
    h.split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) out[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
    out.raw = h; return out;
  }
  async function unwrap(token) {
    var te = new TextEncoder();
    var id = hex(await crypto.subtle.digest('SHA-256', te.encode(token))).slice(0, 16);
    var e = CFG.keys[id]; if (!e) return null;
    var base = await crypto.subtle.importKey('raw', te.encode(token), 'PBKDF2', false, ['deriveKey']);
    var kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(e.s), iterations: CFG.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(e.iv) }, kek, b64(e.ct)))); } catch (err) { return null; }
  }
  async function appHtml() {
    var key = await crypto.subtle.importKey('raw', b64(P.k), 'AES-GCM', false, ['decrypt']);
    var html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(CFG.app.iv) }, key, b64(CFG.app.ct)));
    var tracker = '<script>(function(){var R=' + JSON.stringify(R) + ',L=' + JSON.stringify(CFG.log || {}) + ',last="";' +
      'function log(ev,ex){var line=R+": "+ev+(ex?" ("+ex+")":"");try{if(L.ntfy)fetch(L.ntfy+"?title="+encodeURIComponent("Credit risk case")+"&tags=eyes",{method:"POST",body:line,mode:"no-cors",keepalive:true}).catch(function(){});' +
      'if(L.form&&L.form.url){var d=new URLSearchParams();d.append(L.form.who,R);d.append(L.form.ev,ev);d.append(L.form.extra,ex||"");d.append(L.form.ua,(navigator.userAgent||"").slice(0,200));fetch(L.form.url,{method:"POST",mode:"no-cors",body:d,keepalive:true}).catch(function(){});}}catch(e){}}' +
      'function v(){var h=(location.hash.replace("#","").split("/")[0])||"explore";if(h!==last){last=h;log("viewed",h);}}window.addEventListener("hashchange",v);setTimeout(v,800);})();<\/script>';
    return html.replace(/<\/body>/i, tracker + '</body>');
  }
  function write(html) {
    history.replaceState(null, '', location.pathname + location.search + '#' + VIEW);
    document.open(); document.write(html); document.close();
  }
  function showWelcome() {
    $('hello').textContent = P.n ? 'Welcome, ' + P.n : 'Welcome';
    $('lock').hidden = true; $('form').hidden = true; $('msg').textContent = '';
    $('stage').hidden = false; $('sub').hidden = false; $('sub').textContent = SUB;
    $('foot').textContent = 'Private link. Please do not forward it.';
    setTimeout(function () { $('enter').focus({ preventScroll: true }); }, 50);
  }
  function showLocked(text) {
    $('hello').textContent = 'This analysis is private';
    $('stage').hidden = true; $('lock').hidden = false; $('form').hidden = false;
    $('sub').textContent = 'Open it from the link you received, or paste the link or access code below.';
    $('msg').textContent = text || '';
    $('foot').textContent = 'Access by invitation.';
  }
  async function enter() {
    var btn = $('enter'); if (btn.classList.contains('busy')) return;
    btn.classList.add('busy'); log('entered', VIEW);
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var htmlP = appHtml();
    if (!reduce) {
      var r = btn.getBoundingClientRect(), c = $('cover');
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var far = Math.max(Math.hypot(cx, cy), Math.hypot(innerWidth - cx, cy), Math.hypot(cx, innerHeight - cy), Math.hypot(innerWidth - cx, innerHeight - cy));
      c.style.width = c.style.height = r.width + 'px';
      c.style.left = (cx - r.width / 2) + 'px'; c.style.top = (cy - r.height / 2) + 'px';
      void c.offsetWidth; c.classList.add('go'); c.style.transform = 'scale(' + (2 * far / r.width + 0.2).toFixed(2) + ')';
      await new Promise(function (res) { setTimeout(res, 780); });
      $('veil').classList.add('go');
      await new Promise(function (res) { setTimeout(res, 330); });
    }
    try { write(await htmlP); } catch (e) { btn.classList.remove('busy'); $('cover').className = 'cover'; $('cover').style.transform = ''; $('veil').className = 'veil'; showLocked('Something went wrong opening the analysis. Please reload the page.'); }
  }
  async function tryToken(token, source) {
    if (!token) return false;
    P = await unwrap(token);
    if (!P) { log('invalid link', source); return false; }
    R = P.r; try { sessionStorage.setItem(SKEY, token); } catch (e) {}
    return true;
  }
  async function start() {
    if (!window.crypto || !crypto.subtle || !window.TextEncoder) { showLocked('Please open this link in an up-to-date browser.'); return; }

    }

  }
  $('enter').addEventListener('click', enter);
  $('form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    var v = ($('code').value || '').trim(), m = v.match(/[#&]k=([A-Za-z0-9_-]+)/), vm = v.match(/[#&]v=([a-z\/]+)/);

    if (await tryToken(m ? m[1] : v, 'code')) { log('unlocked with a code'); showWelcome(); }
    else $('msg').textContent = 'That link or code is not valid.';
  });
  window.addEventListener('hashchange', function () { if (/[#&]k=/.test(location.hash)) start(); });
  start();
})();
